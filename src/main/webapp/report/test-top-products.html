<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test Top Products API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        pre { background: #f4f4f4; padding: 10px; overflow: auto; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>🧪 Test Top Products API</h1>
    
    <button onclick="testAPI()">Test API Now</button>
    <button onclick="testDirectDAO()">Test /report/test-api</button>
    
    <h2>Console Output:</h2>
    <div id="console"></div>
    
    <h2>API Response:</h2>
    <pre id="response">Click button to test...</pre>
    
    <h2>Top Products Table:</h2>
    <table id="productsTable">
        <thead>
            <tr>
                <th>#</th>
                <th>Product Name</th>
                <th>Quantity</th>
                <th>Price</th>
                <th>Revenue</th>
                <th>Share</th>
            </tr>
        </thead>
        <tbody id="productsBody">
            <tr><td colspan="6">No data yet</td></tr>
        </tbody>
    </table>
    
    <script>
        function log(message, type = 'info') {
            const div = document.getElementById('console');
            const p = document.createElement('p');
            p.className = type;
            p.textContent = new Date().toLocaleTimeString() + ' - ' + message;
            div.appendChild(p);
            console.log(message);
        }
        
        function testAPI() {
            log('Testing main API endpoint...', 'info');
            
            const endDate = new Date().toISOString().split('T')[0];
            const startDate = new Date(Date.now() - 30*24*60*60*1000).toISOString().split('T')[0];
            
            const url = `/LiteFlow/report/revenue?action=api&startDate=${startDate}&endDate=${endDate}`;
            log('URL: ' + url, 'info');
            
            fetch(url)
                .then(response => {
                    log('Status: ' + response.status, response.ok ? 'success' : 'error');
                    return response.json();
                })
                .then(data => {
                    log('Data received', 'success');
                    document.getElementById('response').textContent = JSON.stringify(data, null, 2);
                    
                    if (data.topProducts) {
                        log('topProducts found: ' + data.topProducts.length + ' items', 'success');
                        renderTable(data.topProducts);
                    } else {
                        log('topProducts NOT found in response', 'error');
                    }
                })
                .catch(error => {
                    log('Error: ' + error.message, 'error');
                    document.getElementById('response').textContent = 'Error: ' + error.message;
                });
        }
        
        function testDirectDAO() {
            log('Testing direct DAO endpoint...', 'info');
            
            fetch('/LiteFlow/report/test-api')
                .then(response => {
                    log('Status: ' + response.status, response.ok ? 'success' : 'error');
                    return response.json();
                })
                .then(data => {
                    log('Data received', 'success');
                    document.getElementById('response').textContent = JSON.stringify(data, null, 2);
                    
                    if (data.topProducts) {
                        log('topProducts found: ' + data.topProducts.length + ' items', 'success');
                        renderTable(data.topProducts);
                    } else {
                        log('topProducts NOT found in response', 'error');
                    }
                })
                .catch(error => {
                    log('Error: ' + error.message, 'error');
                    document.getElementById('response').textContent = 'Error: ' + error.message;
                });
        }
        
        function renderTable(products) {
            const tbody = document.getElementById('productsBody');
            tbody.innerHTML = '';
            
            if (!products || products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6">No products</td></tr>';
                return;
            }
            
            products.forEach((p, i) => {
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td>${i + 1}</td>
                    <td><strong>${p.name}</strong></td>
                    <td>${p.quantity}</td>
                    <td>${p.price}</td>
                    <td><strong>${p.revenue}</strong></td>
                    <td>${p.share}</td>
                `;
            });
            
            log('Table rendered with ' + products.length + ' products', 'success');
        }
    </script>
</body>
</html>
