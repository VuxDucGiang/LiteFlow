# Test Configuration for LiteFlow Integration Tests
# Mock External Services
mock.payment.gateway=true
mock.email.service=true
mock.oauth.service=true

# Test Database
test.db.url=jdbc:h2:mem:testdb
test.db.user=sa
test.db.password=

# JWT Test Configuration
jwt.secret=test-secret-key-for-integration-tests-do-not-use-in-production
jwt.expiration=28800000
jwt.refresh.expiration=604800000

# Coverage
jacoco.output=target/jacoco-integration
jacoco.append=true

# Logging
logging.level.com.liteflow=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN

